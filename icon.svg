<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<defs><clipPath id="c"><rect width="512" height="512" rx="118"/></clipPath>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f6bff"/><stop offset=".55" stop-color="#1237a0"/><stop offset="1" stop-color="#071a4d"/></linearGradient>
<radialGradient id="glow" cx=".3" cy=".18" r=".7"><stop offset="0" stop-color="#9bc0ff" stop-opacity=".75"/><stop offset="1" stop-color="#9bc0ff" stop-opacity="0"/></radialGradient>
<linearGradient id="pp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfdcff"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fa9e8"/><stop offset="1" stop-color="#5b78c7"/></linearGradient>
<radialGradient id="gold" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff2b0"/><stop offset=".45" stop-color="#f5c63c"/><stop offset="1" stop-color="#c78a0c"/></radialGradient>
<linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe58a"/><stop offset="1" stop-color="#a86d05"/></linearGradient>
<linearGradient id="pen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff9d2e"/><stop offset=".5" stop-color="#ffd23f"/><stop offset="1" stop-color="#e07a0a"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#020c2e" flood-opacity=".55"/></filter>
<filter id="sh2" x="-30%" y="-30%" width="170%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#3a2500" flood-opacity=".5"/></filter>
</defs>
<rect width="512" height="512" rx="118" fill="url(#bg)"/>
<g clip-path="url(#c)"><rect width="512" height="512" fill="url(#glow)"/>
