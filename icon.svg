  <g fill="#1d4fc4"><circle cx="150" cy="176" r="9"/><circle cx="150" cy="226" r="9"/><circle cx="150" cy="276" r="9"/></g>
  <g fill="#b4c3e8"><rect x="172" y="170" width="126" height="10" rx="5"/><rect x="172" y="220" width="104" height="10" rx="5"/><rect x="172" y="270" width="120" height="10" rx="5"/></g>
  <g fill="none" stroke="#e2a312" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M142 322l8 8 14-16"/><path d="M142 360l8 8 14-16"/></g>
  <g fill="#b4c3e8"><rect x="176" y="320" width="100" height="9" rx="4.5"/><rect x="176" y="358" width="116" height="9" rx="4.5"/></g>
</g>
<!-- pencil -->
